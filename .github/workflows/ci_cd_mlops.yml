name: Klassed MLOps, Deep Testing & Full-Stack CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mlops-training-validation-and-harness:
    name: ML Training, 5-Fold CV, Psychometric Harness & 18-Suite Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python Backend & ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Stage 1 — Data & Taxonomy Schema Gate
        run: |
          python -m model.validate_question_bank
          python -m model.validate_weightage_file

      - name: Stage 2 — Deep Training, 5-Fold Stratified CV & Champion Accuracy Gate (>=99.0%)
        run: |
          python -m model.training_and_validation_pipeline

      - name: Stage 3 — Multi-Persona Psychometric, Bandit Regret & SLA Evaluation Harness
        run: |
          python -m model.evaluation_harness

      - name: Stage 4 — 18 Deep Unit, Integration, Security & Concurrency Test Suites
        run: |
          python backend/tests/test_v2_engine.py

  frontend-typecheck-and-build:
    name: Frontend TypeScript Typecheck & Vite Production Build Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies & Build Production Bundle
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
