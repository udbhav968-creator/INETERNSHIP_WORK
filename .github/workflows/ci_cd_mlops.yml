name: Klassed MLOps, Deep Testing & Full-Stack CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  standalone-mlops-governance-and-training:
    name: Pure ML Training, 5-Fold CV, 21-Artifact Checksum Registry & 21-Suite ML Gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install ML & Psychometric Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Stage 1 — Data, Taxonomy & 65-Chapter Distribution Audit
        run: |
          python -m model.validate_question_bank data/tagged_questions/neet_questions_clean.json
          python -m model.validate_weightage_file data/taxonomy/NEET_Unified_Weightage_And_Marks_2013_2026.json
          python -m model.corpus_distribution_and_readiness_audit

      - name: Stage 2 — Multi-Model Champion-Challenger Tournament, 5-Fold CV & SHA-256 Registry
        run: |
          python -m model.training_and_validation_pipeline

      - name: Stage 3 — Cryptographic Artifact Checksum & Cold-Start Boot SLA Gate
        run: |
          python -m model.verify_artifact_integrity

      - name: Stage 4 — Multi-Persona Psychometric, Bandit Regret & 8-Subsystem SLA Harness
        run: |
          python -m model.evaluation_harness

      - name: Stage 5 — 21 Standalone Pure-ML & MLOps Verification Suites
        run: |
          python -m model.tests.test_ml_standalone_suite

      - name: Stage 6 — Publish MLOps & Corpus Distribution Governance Summary
        run: |
          python -m model.verify_artifact_integrity --markdown-summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload MLOps Validation, Distribution & Registry Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: klassed-mlops-governance-reports
          path: |
            model/validation_report.json
            model/harness_benchmark_report.json
            model/corpus_distribution_report.json
            model/model_registry_manifest.json
            model/question_difficulty_metrics.json
            model/tier_recalibration_proposal.json
            model/question_similarity_report.json
            model/rf_temperature_calibration.json
            model/bkt_chapter_parameters.json
            model/dina_calibrated_parameters.json
            model/linucb_prior_init.json
            model/conformal_laplacian_model.json

  fullstack-integration-and-security-gate:
    name: Full-Stack Psychometric, Concurrency, Security & 28-Suite Gate
    needs: standalone-mlops-governance-and-training
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python Backend & ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run All 28 Deep Unit, Integration, Concurrency & Forensic Suites
        run: |
          python backend/tests/test_v2_engine.py

  frontend-build-and-devops-container-gate:
    name: Frontend Production Bundle & DevOps Container Hardening Gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Verify Hardened Container, Prometheus Stack & Cloud Deployment Manifests
        run: |
          test -f .dockerignore
          test -f docker-compose.observability.yml
          test -f ops/prometheus.yml
          grep -q "HEALTHCHECK" Dockerfile
          grep -q "USER appuser" Dockerfile
          grep -q "model.verify_artifact_integrity" Dockerfile
          test -f render.yaml
          test -f railway.json
          test -f vercel.json

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies & Build Production Bundle
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
