name: Klassed Production Canary, Prometheus & SHA-256 Telemetry Audit

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  live-production-canary-and-artifact-audit:
    name: Live Vercel Canary, Prometheus Scrape & Core Artifact Checksum Gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python (version from .python-version)
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            model/ml-training-constraints.txt

      - name: Install Python Dependencies (training pins)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c model/ml-training-constraints.txt

      - name: Verify Core and ML Extension SHA-256 Registries Locally
        run: |
          python -m model.verify_artifact_integrity
          python -m model.ml_extension_registry
          python -m model.serving_runtime_parity --strict

      - name: Probe Live Production Health, Corpus Audit & Prometheus Metrics
        run: |
          python -u backend/tests/test_live_e2e_integration.py https://klassed-neet-adaptive-engine.vercel.app
